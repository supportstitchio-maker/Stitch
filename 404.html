  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#FFFFFF;
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 24px;
  }

  .stage{
    width:100%;
    max-width:460px;
    text-align:center;
  }

  .scene{
    width:260px;
    margin:0 auto 20px;
  }

  .scene svg{ width:100%; height:auto; display:block; }

  .eyebrow{
    font-family:'Colmeak','Montserrat', sans-serif;
    font-size:19px;
    line-height:1.4;
    font-weight:700;
    margin:0 0 6px;
    background-image:linear-gradient(135deg, var(--orange), var(--royal));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p.desc{
    font-family:'Montserrat', sans-serif;
    font-size:16px;
    font-weight:400;
    line-height:1.6;
    color:var(--steel-dark);
    margin:0 0 28px;
  }

  p.desc a{
    color:var(--orange);
    font-weight:600;
    text-decoration:none;
  }

  p.desc a:hover{
    text-decoration:underline;
  }

  @media (min-width:900px){
    .stage{ max-width:560px; }
    .scene{ width:320px; margin-bottom:28px; }
    .eyebrow{ font-size:23px; margin-bottom:8px; }
    p.desc{ font-size:18px; margin-bottom:34px; }
  }

  @media (max-width:360px){
    h1{ font-size:22px; }
    .scene{ width:210px; }
  }
</style>
</head>
<body>

  <div class="stage">

    <div class="scene">
      <svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ground shadow -->
        <ellipse cx="205" cy="300" rx="145" ry="13" fill="#E7E9EB"/>

        <!-- back leg (dark grey) -->
        <line x1="255" y1="150" x2="304" y2="292" stroke="var(--outline)" stroke-width="34" stroke-linecap="round"/>
        <line x1="255" y1="150" x2="304" y2="292" stroke="var(--steel-mid)" stroke-width="24" stroke-linecap="round"/>

        <!-- crossbar (behind board) -->
        <line x1="150" y1="228" x2="288" y2="228" stroke="var(--outline)" stroke-width="26" stroke-linecap="round"/>
        <line x1="150" y1="228" x2="288" y2="228" stroke="var(--steel-mid)" stroke-width="17" stroke-linecap="round"/>

        <!-- left traffic cone (behind board, peeking) -->
        <g transform="translate(60,150)">
          <path d="M45 0 L88 138 L2 138 Z" fill="var(--outline)"/>
          <path d="M45 8 L82 134 L8 134 Z" fill="var(--orange)" stroke="var(--outline)" stroke-width="6" stroke-linejoin="round"/>
          <path d="M24 52 L66 52 L70 70 L20 70 Z" fill="#fff" stroke="var(--outline)" stroke-width="5" stroke-linejoin="round"/>
          <rect x="-6" y="134" width="102" height="18" rx="4" fill="var(--brown)" stroke="var(--outline)" stroke-width="6"/>
        </g>

        <!-- striped board -->
        <g transform="rotate(-10 220 130)">
          <rect x="140" y="82" width="160" height="96" rx="10" fill="var(--outline)"/>
          <rect x="146" y="88" width="148" height="84" rx="7" fill="#fff" stroke="var(--outline)" stroke-width="6"/>
          <clipPath id="boardStripes">
            <rect x="146" y="88" width="148" height="84" rx="7"/>
          </clipPath>
          <g clip-path="url(#boardStripes)">
            <rect x="120" y="70" width="20" height="130" fill="var(--royal)" transform="rotate(30 130 135)"/>
            <rect x="156" y="70" width="20" height="130" fill="var(--royal)" transform="rotate(30 166 135)"/>
            <rect x="192" y="70" width="20" height="130" fill="var(--royal)" transform="rotate(30 202 135)"/>
            <rect x="228" y="70" width="20" height="130" fill="var(--royal)" transform="rotate(30 238 135)"/>
            <rect x="264" y="70" width="20" height="130" fill="var(--royal)" transform="rotate(30 274 135)"/>
            <rect x="300" y="70" width="20" height="130" fill="var(--royal)" transform="rotate(30 310 135)"/>
          </g>
        </g>

        <!-- front leg (light grey) -->
        <line x1="175" y1="150" x2="126" y2="292" stroke="var(--outline)" stroke-width="34" stroke-linecap="round"/>
        <line x1="175" y1="150" x2="126" y2="292" stroke="var(--steel-light)" stroke-width="24" stroke-linecap="round"/>

        <!-- front crossbar cap -->
        <line x1="150" y1="228" x2="220" y2="228" stroke="var(--outline)" stroke-width="26" stroke-linecap="round"/>
        <line x1="150" y1="228" x2="220" y2="228" stroke="var(--steel-mid)" stroke-width="17" stroke-linecap="round"/>

        <!-- right traffic cone (in front) -->
        <g transform="translate(268,152)">
          <path d="M45 0 L88 138 L2 138 Z" fill="var(--outline)"/>
          <path d="M45 8 L82 134 L8 134 Z" fill="var(--orange)" stroke="var(--outline)" stroke-width="6" stroke-linejoin="round"/>
          <path d="M24 52 L66 52 L70 70 L20 70 Z" fill="#fff" stroke="var(--outline)" stroke-width="5" stroke-linejoin="round"/>
          <rect x="-6" y="134" width="102" height="18" rx="4" fill="var(--brown)" stroke="var(--outline)" stroke-width="6"/>
        </g>

      </svg>
    </div>

    <p class="eyebrow">Sorry, page not found.</p>
    <p class="desc">This road doesn&rsquo;t lead anywhere, or the link is broken. Click <a href="/index.html" id="home-link" onclick="return goHomeOrFallback(event)">here</a> to get back home.</p>

    <script>
      // Try to get back to the Stitch homepage first. If Stitch itself is
      // down (not just this one broken link), a normal navigation to
      // /index.html would just fail too -- so we do a quick reachability
      // check first, and if that fails, send the person to a neutral
      // blank page instead of bouncing them back into a site that isn't
      // loading. (There's no web API that can open the browser's own
      // configured homepage -- that setting is never exposed to page
      // JavaScript for privacy reasons -- so a blank page is the closest
      // safe, site-independent fallback we can actually navigate to.)
      function goHomeOrFallback(e){
        e.preventDefault();
        const timeout = new Promise(resolve => setTimeout(() => resolve(false), 2500));
        const check = fetch('/index.html', { method: 'HEAD', cache: 'no-store' })
          .then(res => res.ok)
          .catch(() => false);
        Promise.race([check, timeout]).then(reachable => {
          window.location.href = reachable ? '/index.html' : 'about:blank';
        });
        return false;
      }
    </script>

  </div>
