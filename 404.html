<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Stitch</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0a2540 0%, #4169e1 100%);
      color: #fff;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    img { width: 96px; height: auto; margin-bottom: 20px; }
    h1 { font-size: 72px; margin: 0; font-weight: 800; letter-spacing: -2px; }
    p { font-size: 17px; color: rgba(255,255,255,0.85); margin: 10px 0 28px; max-width: 360px; line-height: 1.5; }
    a.btn {
      display: inline-block;
      background: #fff;
      color: #1e3a8a;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 28px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="assets/favicon.png" alt="Stitch">
    <h1>404</h1>
    <p>This page doesn't exist, or the link is broken. Let's get you back to Stitch.</p>
    <a class="btn" href="/">Go to Stitch</a>
  </div>
</body>
</html>
