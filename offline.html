  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#FFFFFF;
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 24px;
  }

  .stage{
    width:100%;
    max-width:460px;
    text-align:center;
  }

  .scene{
    width:260px;
    margin:0 auto 20px;
  }

  .scene svg{ width:100%; height:auto; display:block; }

  .eyebrow{
    font-family:'Gendy','Montserrat', sans-serif;
    font-size:19px;
    line-height:1.4;
    font-weight:700;
    margin:0 0 6px;
    background-image:linear-gradient(135deg, var(--orange), var(--royal));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p.desc{
    font-family:'Montserrat', sans-serif;
    font-size:16px;
    font-weight:400;
    line-height:1.6;
    color:var(--steel-dark);
    margin:0 0 28px;
  }

  p.desc a{
    color:var(--orange);
    font-weight:600;
    text-decoration:none;
  }

  p.desc a:hover{
    text-decoration:underline;
  }

  @media (min-width:900px){
    .stage{ max-width:560px; }
    .scene{ width:320px; margin-bottom:28px; }
    .eyebrow{ font-size:23px; margin-bottom:8px; }
    p.desc{ font-size:18px; margin-bottom:34px; }
  }

  @media (max-width:360px){
    h1{ font-size:22px; }
    .scene{ width:210px; }
  }

  .retry-btn{
    font-family:'Montserrat', sans-serif;
    font-size:15px;
    font-weight:700;
    color:#fff;
    border:none;
    border-radius:999px;
    padding:13px 30px;
    cursor:pointer;
    background-image:linear-gradient(135deg, var(--orange), var(--royal));
    box-shadow:0 8px 20px -6px rgba(65,105,225,0.55);
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  .retry-btn:active{ transform:scale(0.97); }
  .retry-btn:disabled{ opacity:0.7; cursor:default; }

  .retry-btn svg{ transition:transform 0.5s ease; }
  .retry-btn.spinning svg{ animation:retrySpin 0.7s linear infinite; }
  @keyframes retrySpin{ to{ transform:rotate(360deg); } }

  .retry-status{
    font-family:'Montserrat', sans-serif;
    font-size:13px;
    color:var(--steel-mid);
    margin-top:14px;
    min-height:18px;
  }
</style>
</head>
<body>

  <div class="stage">

    <div class="scene">
      <svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ground shadow -->
        <ellipse cx="200" cy="300" rx="145" ry="13" fill="#E7E9EB"/>

        <!-- wifi arcs, outer -> inner, with a gap ("disconnected") between the outer two arcs and
           the base dot, matching the 404 page's thick-outline + brand-gradient-fill line-art style -->
        <path d="M70 158 A184 184 0 0 1 330 158" stroke="var(--outline)" stroke-width="26" stroke-linecap="round" fill="none"/>
        <path d="M70 158 A184 184 0 0 1 330 158" stroke="var(--steel-light)" stroke-width="16" stroke-linecap="round" fill="none"/>

        <path d="M112 206 A128 128 0 0 1 288 206" stroke="var(--outline)" stroke-width="26" stroke-linecap="round" fill="none"/>
        <path d="M112 206 A128 128 0 0 1 288 206" stroke="var(--steel-mid)" stroke-width="16" stroke-linecap="round" fill="none"/>

        <path d="M156 253 A72 72 0 0 1 244 253" stroke="var(--outline)" stroke-width="26" stroke-linecap="round" fill="none"/>
        <path d="M156 253 A72 72 0 0 1 244 253" stroke="var(--royal)" stroke-width="16" stroke-linecap="round" fill="none"/>

        <!-- base dot -->
        <circle cx="200" cy="282" r="17" fill="var(--outline)"/>
        <circle cx="200" cy="282" r="11" fill="var(--royal)"/>

        <!-- diagonal "disconnected" slash, same construction as the cone outlines: a thick dark
           outline stroke with a slightly thinner orange stroke on top -->
        <line x1="88" y1="108" x2="312" y2="292" stroke="var(--outline)" stroke-width="30" stroke-linecap="round"/>
        <line x1="88" y1="108" x2="312" y2="292" stroke="var(--orange)" stroke-width="18" stroke-linecap="round"/>

      </svg>
    </div>

    <p class="eyebrow">No internet connection.</p>
    <p class="desc" id="offline-desc">Check your connection, then give it another try.</p>

    <button type="button" class="retry-btn" id="retry-btn" onclick="retryConnection()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      Tap to retry
    </button>
    <p class="retry-status" id="retry-status"></p>

    <script>
      // Auto-recover: this page must never trap someone who actually has internet
      var autoBusy = false, leaving = false;
      function autoCheck(){
        if (autoBusy || leaving) return;
        autoBusy = true;
        var ctl = (window.AbortController ? new AbortController() : null);
        var t = setTimeout(function(){ if (ctl) ctl.abort(); }, 4000);
        fetch('/index.html?ping=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: ctl ? ctl.signal : undefined })
          .then(function(res){
            clearTimeout(t);
            if (res && res.ok) {
              leaving = true;
              var st = document.getElementById('retry-status');
              if (st) st.textContent = 'Back online -- loading...';
              window.location.replace('/');
            }
          })
          .catch(function(){ clearTimeout(t); })
          .then(function(){ autoBusy = false; });
      }
      setInterval(autoCheck, 2000);
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) autoCheck(); });
      window.addEventListener('focus', autoCheck);
      window.addEventListener('pageshow', autoCheck);
      window.addEventListener('online', autoCheck);
      autoCheck();

      // Real network check (more reliable than navigator.onLine).
      function retryConnection(){
        const btn = document.getElementById('retry-btn');
        const status = document.getElementById('retry-status');
        btn.disabled = true;
        btn.classList.add('spinning');
        status.textContent = 'Checking...';

        const timeout = new Promise(resolve => setTimeout(() => resolve(false), 4000));
        const check = fetch('/index.html', { method: 'HEAD', cache: 'no-store' })
          .then(res => res.ok)
          .catch(() => false);

        Promise.race([check, timeout]).then(reachable => {
          if (reachable) {
            status.textContent = "Back online -- loading...";
            window.location.href = '/index.html';
          } else {
            btn.disabled = false;
            btn.classList.remove('spinning');
            status.textContent = "Still can't reach the internet. Try again in a moment.";
          }
        });
      }
    </script>

  </div>

</body>
</html>
